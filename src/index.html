<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manna — Study Desk</title>
<!--
  CSP strategy (P0.1, §44): the artifact is fully self-contained — inline
  script and inline style only. connect-src 'none' makes any network attempt
  fail at the platform level, so the offline guarantee does not depend on
  discipline alone. Later security packets may tighten further.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
<!-- MANNA:META -->
<!-- MANNA:CSS -->
</head>
<body>
<div id="app"></div>
<!-- MANNA:ICONS -->
<!-- MANNA:JS -->
</body>
</html>
